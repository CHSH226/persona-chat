<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>数字生命</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="chat-wrapper">
    <header class="chat-header">
      <div class="header-title">数字生命</div>
      <div class="header-right">
        <span class="credits-pill" id="creditsPill">0 积分</span>
        <button class="icon-btn" id="redeemBtn">兑换码</button>
        <button class="icon-btn" id="logoutBtn">退出</button>
      </div>
    </header>
    <div class="announce" id="announce"></div>
    <main id="messages" class="messages"></main>
    <footer class="input-bar">
      <textarea id="input" rows="1" placeholder="说点什么..." maxlength="2000"></textarea>
      <button id="send">发送</button>
    </footer>
  </div>

  <!-- 兑换码弹窗 -->
  <div class="modal-mask hidden" id="redeemMask">
    <div class="modal">
      <h3>输入兑换码</h3>
      <input id="redeemInput" placeholder="请输入兑换码" />
      <div class="row">
        <button class="cancel" id="redeemCancel">取消</button>
        <button class="ok" id="redeemOk">兑换</button>
      </div>
      <div class="err" id="redeemErr"></div>
    </div>
  </div>

  <script src="/static/chat.js"></script>
</body>
</html>
